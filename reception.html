<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドコモショップ AI受付</title>
    <style>
        :root { --primary: #cc0000; --bg: #ffffff; }
        body { font-family: "Hiragino Kaku Gothic ProN", sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: var(--primary); color: white; padding: 25px; text-align: center; font-size: 32px; font-weight: bold; border-bottom: 8px solid #a00000; }
        #status-bar { background: #000; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 30px; position: relative; }
        .bubble { padding: 30px; border-radius: 20px; max-width: 85%; line-height: 1.4; font-size: 36px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 2; }
        .ai { background: #f0f0f0; align-self: flex-start; color: #000; border: 3px solid #ccc; }
        .user { background: #fff0f0; border: 4px solid var(--primary); align-self: flex-end; color: #cc0000; }
        
        /* AIイラストの配置 */
        .ai-char { width: 250px; height: auto; position: absolute; bottom: 10px; left: 10px; opacity: 0.8; z-index: 1; }

        #controls { background: #eee; border-top: 5px solid #ccc; padding: 40px 20px 80px 20px; text-align: center; }
        
        /* 巨大受付ボタン */
        #start-btn { 
            width: 80%; padding: 50px; font-size: 48px; font-weight: bold; 
            background: var(--primary); color: white; border: none; border-radius: 30px; 
            box-shadow: 0 10px 0 #a00000; cursor: pointer;
        }
        #start-btn:active { transform: translateY(10px); box-shadow: none; }

        /* マイクボタン（会話中のみ表示） */
        #mic-btn { width: 140px; height: 140px; border-radius: 50%; background: var(--primary); color: white; border: 8px solid #fff; font-size: 70px; display: none; margin: 0 auto; }
        #mic-btn.listening { background: #008000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <header>ドコモショップ 受付</header>
    <div id="status-bar">ボタンを押してください</div>
    
    <div id="chat-container">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgfD18k-t2v2i1mXW5Z4F0-E4Z_zQ9E5vY8L4oDkI_V6X6Q2P7v3Uu4P9q/s800/business_woman_reception.png" class="ai-char" alt="AIスタッフ">
    </div>

    <div id="controls">
        <button id="start-btn" onclick="initChat()">受付をはじめる</button>
        <button id="mic-btn" onclick="toggleMic()">🎤</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const firebaseConfig = {
            apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
            authDomain: "oh-tai.firebaseapp.com",
            projectId: "oh-tai",
            storageBucket: "oh-tai.firebasestorage.app",
            messagingSenderId: "1070284840120",
            appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const genAI = new GoogleGenerativeAI("AIzaSyC2nltuDWJ1wSKFnKF4zXN3Y4dtYlTIyxQ");
        const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-lite-001" });

        const systemInstruction = `
            あなたはドコモショップの受付スタッフです。役割は「受付情報の収集」のみです。
            以下の手順で進めてください。雑談や機種案内は【厳禁】です。

            1. 挨拶し、「ご用件を教えてください」と聞く。
            2. 「名字のみお名前を教えていただけますか？」と聞く。
            3. 「ご契約者ご本人様でしょうか？」と聞く。
            4. 「本人確認書類（免許証等）の原本はお持ちですか？」と聞く。
            5. 書類がないと言われた場合、「お手続きの内容によっては、本日の受付が制限される可能性がございます。あらかじめご了承ください」と伝える。
            6. 最後は必ず「ご対応予定時間をスタッフがお伝えしにまいります。このままお待ちください。」で締める。

            記号・絵文字・アスタリスクは絶対に出さない。60文字以内。
        `;

        let chat = model.startChat({ history: [] });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = (SpeechRecognition) ? new SpeechRecognition() : null;
        if(recognition) {
            recognition.lang = "ja-JP";
            recognition.onstart = () => { document.getElementById("mic-btn").classList.add("listening"); updateStatus("どうぞお話しください", "green"); };
            recognition.onend = () => { document.getElementById("mic-btn").classList.remove("listening"); updateStatus("待機中", "#000"); };
            recognition.onresult = (e) => processInput(e.results[0][0].transcript);
        }

        window.initChat = () => {
            document.getElementById("start-btn").classList.add("hidden");
            document.getElementById("mic-btn").classList.remove("hidden");
            document.getElementById("mic-btn").style.display = "block";
            const welcome = "いらっしゃいませ。本日はどのようなご用件でしょうか？";
            addBubble(welcome, "ai");
            speak(welcome, true);
        };

        window.toggleMic = () => { try { recognition.start(); } catch(e) { recognition.stop(); } };

        async function processInput(text) {
            addBubble(text, "user");
            updateStatus("確認中...", "blue");

            try {
                const result = await chat.sendMessage(text);
                const response = result.response.text();
                addBubble(response, "ai");

                if (response.includes("スタッフがお伝えしにまいります")) {
                    await sendFinalDataToDB();
                    speak(response, false);
                } else {
                    speak(response, true);
                }
            } catch (e) { console.error(e); }
        }

        async function sendFinalDataToDB() {
            try {
                const history = await chat.getHistory();
                const conversationText = history.filter(h => h.role === "user").map(h => h.parts[0].text).join(" / ");
                
                // データ抽出
                const extractor = `会話: ${conversationText} から [名字, 用件, 備考(本人か、書類あるか、詳細)] をカンマ区切りで抽出して。`;
                const result = await model.generateContent(extractor);
                const raw = result.response.text().split(",");
                
                // 管理ボード(index.html)のセレクトボックス項目に合わせる
                const validContents = ["新規契約", "機種変更", "故障・修理", "料金相談", "プラン変更", "操作説明", "解約"];
                let detectedContent = "その他";
                validContents.forEach(c => { if(conversationText.includes(c.substring(0,2))) detectedContent = c; });

                await addDoc(collection(db, "visitors"), {
                    name: (raw[0] || "お客様").trim() + " 様",
                    table: "AI受付",
                    content: detectedContent,
                    memo: (raw[2] || conversationText).trim(),
                    createdAt: serverTimestamp(),
                    timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                });
                updateStatus("受付完了", "#000");
            } catch(e) { console.error(e); }
        }

        function addBubble(t, type) {
            const d = document.createElement("div");
            d.className = "bubble " + type;
            d.innerText = t.replace(/[\\*\\_]/g, '');
            const c = document.getElementById("chat-container");
            c.appendChild(d);
            c.scrollTo(0, c.scrollHeight);
        }

        function speak(t, autoMic) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t.replace(/[\\*\\_]/g, ''));
            u.lang = "ja-JP"; u.pitch = 1.3;
            u.onend = () => { if(autoMic) toggleMic(); };
            window.speechSynthesis.speak(u);
        }

        function updateStatus(text, color) { document.getElementById("status-bar").innerText = text; document.getElementById("status-bar").style.backgroundColor = color; }
    </script>
</body>
</html>
