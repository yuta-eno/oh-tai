<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドコモショップ AI受付</title>
    <style>
        :root { --primary: #cc0000; --bg: #ffffff; }
        body { 
            font-family: "Hiragino Kaku Gothic ProN", sans-serif; 
            margin: 0; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            /* ★生成したイラストを背景に設定 */
            background-image: url('https://googleusercontent.com/image_generation_content/5');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        header { background: var(--primary); color: white; padding: 25px; text-align: center; font-size: 32px; font-weight: bold; border-bottom: 8px solid #a00000; z-index: 10; }
        #status-bar { background: rgba(0, 0, 0, 0.8); color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 24px; z-index: 10; }
        
        /* チャットエリア（背景が見えるように透過） */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 30px; background: rgba(255, 255, 255, 0.2); }
        .bubble { padding: 30px; border-radius: 25px; max-width: 75%; line-height: 1.4; font-size: 34px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 2; }
        .ai { background: rgba(240, 240, 240, 0.95); align-self: flex-start; border: 3px solid #ccc; color: #000; }
        .user { background: rgba(255, 240, 240, 0.95); border: 4px solid var(--primary); align-self: flex-end; color: #cc0000; }
        
        #controls { 
            background: rgba(238, 238, 238, 0.9); /* 半透明にして背景を透かす */
            border-top: 5px solid #ccc; 
            padding: 20px; 
            padding-bottom: 60px; 
            z-index: 10;
        }
        
        /* 巨大受付ボタン */
        #start-area { display: flex; justify-content: center; align-items: center; height: 100%; }
        #start-btn { 
            width: 90%; padding: 60px; font-size: 50px; font-weight: bold; 
            background: var(--primary); color: white; border: none; border-radius: 30px; 
            box-shadow: 0 10px 0 #a00000; cursor: pointer;
        }
        #start-btn:active { transform: translateY(10px); box-shadow: none; }

        /* 会話用コントロール */
        #action-area { display: none; }
        #options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .option-btn { background: #fff; border: 4px solid var(--primary); color: var(--primary); padding: 20px 10px; border-radius: 20px; font-size: 26px; font-weight: bold; box-shadow: 0 4px 0 var(--primary); }
        .option-btn:active { transform: translateY(4px); box-shadow: none; background: var(--primary); color: #fff; }

        #mic-btn { width: 130px; height: 130px; border-radius: 50%; background: var(--primary); color: white; border: 8px solid #fff; font-size: 70px; cursor: pointer; margin-top: 10px; }
        #mic-btn.listening { background: #008000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header>ドコモショップ 受付</header>
    <div id="status-bar">ボタンを押してください</div>
    
    <div id="chat-container"></div>

    <div id="controls">
        <div id="start-area">
            <button id="start-btn" onclick="beginReception()">受付をはじめる</button>
        </div>
        
        <div id="action-area">
            <div id="options">
                <button class="option-btn" onclick="sendText('新規契約')">新規契約</button>
                <button class="option-btn" onclick="sendText('機種変更')">機種変更</button>
                <button class="option-btn" onclick="sendText('故障修理')">故障修理</button>
                <button class="option-btn" onclick="sendText('支払変更')">支払変更</button>
            </div>
            <button id="mic-btn" onclick="toggleMic()">🎤</button>
            <div style="font-size:22px; font-weight:bold; margin-top:10px;">ここを押して話す</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const firebaseConfig = {
            apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
            authDomain: "oh-tai.firebaseapp.com",
            projectId: "oh-tai",
            storageBucket: "oh-tai.firebasestorage.app",
            messagingSenderId: "1070284840120",
            appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const genAI = new GoogleGenerativeAI("AIzaSyC2nltuDWJ1wSKFnKF4zXN3Y4dtYlTIyxQ");
        const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-lite-001" });

        const sysPrompt = `
            あなたはドコモショップの受付です。雑談や機種の詳しい説明は【絶対禁止】。
            役割は「名字」「用件」「本人確認」「書類の有無」を聞くことだけです。
            
            1. 「名字のみお名前を教えていただけますか？」と聞く。
            2. 用件を聞く。
            3. 「ご本人様でしょうか？」と聞く。
            4. 「確認書類（免許証等）の原本はお持ちですか？」と聞く。
            5. 書類がない場合、「手続きが制限される可能性がある」と伝える。
            6. 最後は「スタッフがお伝えしにまいります。このままお待ちください。」で締める。
            
            回答は60文字以内。絵文字やアスタリスクは絶対に使わない。
        `;

        let chat = model.startChat({ history: [{ role: "user", parts: [{ text: "指示: " + sysPrompt }] }] });

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "ja-JP";
        recognition.onstart = () => { document.getElementById("mic-btn").classList.add("listening"); updateStatus("どうぞお話しください", "green"); };
        recognition.onend = () => { document.getElementById("mic-btn").classList.remove("listening"); updateStatus("待機中", "#000"); };
        recognition.onresult = (e) => processInput(e.results[0][0].transcript);

        window.beginReception = () => {
            document.getElementById("start-area").style.display = "none";
            document.getElementById("action-area").style.display = "block";
            const msg = "いらっしゃいませ。恐れ入りますが、名字のみお名前を教えていただけますか？";
            addBubble(msg, "ai");
            speak(msg, true);
        };

        window.toggleMic = () => { try { recognition.start(); } catch(e) { recognition.stop(); } };
        window.sendText = (text) => processInput(text);

        async function processInput(text) {
            addBubble(text, "user");
            updateStatus("確認中...", "blue");
            try {
                const result = await chat.sendMessage(text);
                const response = result.response.text();
                addBubble(response, "ai");
                if (response.includes("スタッフがお伝えしにまいります")) {
                    await sendDataToAdmin();
                    speak(response, false);
                } else {
                    speak(response, true);
                }
            } catch (e) { console.error(e); }
        }

        async function sendDataToAdmin() {
            try {
                const history = await chat.getHistory();
                const userTalk = history.filter(h => h.role === "user").map(h => h.parts[0].text).join(" / ");
                
                const extractor = `会話: ${userTalk} から [名字, 用件, 備考(本人か書類あるか)] をカンマ区切りで抽出。`;
                const res = await model.generateContent(extractor);
                const raw = res.response.text().split(",");
                
                await addDoc(collection(db, "visitors"), {
                    name: (raw[0] || "お客様").trim() + " 様",
                    table: "AI受付",
                    content: (raw[1] || "その他").trim(),
                    memo: (raw[2] || userTalk).trim(),
                    createdAt: serverTimestamp(),
                    timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                });
                updateStatus("受付完了", "#000");
            } catch(e) { console.error(e); }
        }

        function addBubble(t, type) {
            const d = document.createElement("div");
            d.className = "bubble " + type;
            d.innerText = t.replace(/[*_]/g, '');
            const c = document.getElementById("chat-container");
            c.appendChild(d);
            c.scrollTo(0, c.scrollHeight);
        }

        function speak(t, auto) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t.replace(/[*_]/g, ''));
            u.lang = "ja-JP"; u.pitch = 1.3;
            u.onend = () => { if(auto) toggleMic(); };
            window.speechSynthesis.speak(u);
        }

        function updateStatus(t, c) { document.getElementById("status-bar").innerText = t; document.getElementById("status-bar").style.backgroundColor = c; }
    </script>
</body>
</html>
