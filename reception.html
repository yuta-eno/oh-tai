<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{ --primary:#cc0000; }

body{
    font-family:"Hiragino Kaku Gothic ProN",sans-serif;
    margin:0;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

/* 背景 */
body::before{
    content:"";
    position:fixed;
    top:0; left:0; right:0; bottom:0;
    background:url('reception1.png') center/contain no-repeat;
    opacity:0.9;
    pointer-events:none;
    z-index:-10;
}

/* 上部 */
header{
    background:var(--primary);
    color:white;
    padding:12px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}
#status-bar{
    background:#000;
    color:#fff;
    padding:6px;
    text-align:center;
    font-size:18px;
}

/* チャット */
#chat-container{
    flex:1;
    overflow-y:auto;
    padding:15px 15px 160px; /* ← 下に余白追加（マイク隠れ防止） */
    display:flex;
    flex-direction:column;
    gap:15px;
    scroll-behavior:smooth;
}

.bubble{
    padding:18px 22px;
    border-radius:18px;
    max-width:80%;
    font-size:26px;
    font-weight:bold;
}
.ai{background:#f5f5f5;border:1px solid #ccc;align-self:flex-start;}
.user{background:#fff0f0;border:3px solid var(--primary);color:#cc0000;align-self:flex-end;}

/* 下部操作（高さ縮小） */
#controls{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top:2px solid #ccc;
    padding:8px 10px 10px; /* ← 縮小 */
    text-align:center;
    z-index:9999;
}

#start-btn{
    width:95%;
    padding:20px; /* ← 縮小 */
    font-size:32px;
    font-weight:bold;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:50px;
}

#action-area{display:none;}

#mic-btn{
    width:90px;   /* ← 縮小 */
    height:90px;
    border-radius:50%;
    border:6px solid var(--primary);
    font-size:42px;
    color:var(--primary);
}

/* 発話指示 */
#speak-indicator{
    font-size:24px; /* ← 縮小 */
    font-weight:bold;
    margin-top:5px;
    color:#777;
}
#speak-indicator.active{
    font-size:36px;
    color:#cc0000;
    animation:blink 1s infinite;
}
@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}
</style>
</head>

<body>

<header>ドコモショップ川口Ｒ１２２号店 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">受付をはじめる</button>

    <div id="action-area">
        <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <div id="speak-indicator">● お話しください</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig={
 apiKey:"AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
 authDomain:"oh-tai.firebaseapp.com",
 projectId:"oh-tai",
 storageBucket:"oh-tai.firebasestorage.app",
 messagingSenderId:"1070284840120",
 appId:"1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* 質問 */
const Q1="本日はどのようなご用件でしょうか？";
const Q2="恐れ入りますが、名字のみお名前を教えてください。";
const Q3="ご契約者ご本人様でしょうか？";
const Q4="契約者ご本人様へお電話でのご連絡は可能でしょうか？";
const Q5="本人確認書類（免許証またはマイナンバーカード）はお持ちでしょうか？";

let questions=[Q1,Q2,Q3,Q5];
let step=0;

let data={purpose:"",name:"",isSub:"",contact:"",id:""};

/* 判定 */
function isNotSub(t){
 return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(t);
}

/* DOM */
const chat=document.getElementById("chat-container");
const startBtn=document.getElementById("start-btn");
const action=document.getElementById("action-area");
const micBtn=document.getElementById("mic-btn");
const status=document.getElementById("status-bar");
const speakIndicator=document.getElementById("speak-indicator");

/* 受付開始 */
window.beginReception=()=>{
 startBtn.style.display="none";
 action.style.display="block";
 ask();
};

/* 質問 */
function ask(){
 const q=questions[step];
 addBubble(q,"ai");
 speak(q,true);
}

/* 音声認識 */
const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang="ja-JP";

rec.onstart=()=>{
 micBtn.classList.add("listening");
 speakIndicator.classList.add("active");
 status.innerText="聞いています…";
 status.style.background="green";
};

rec.onend=()=>{
 micBtn.classList.remove("listening");
 speakIndicator.classList.remove("active");
 status.innerText="待機中";
 status.style.background="#000";
};

rec.onresult=e=>answer(e.results[0][0].transcript);
window.toggleMic=()=>{try{rec.start();}catch(e){rec.stop();}};

/* 回答処理 */
async function answer(t){
 addBubble(t,"user");
 const q=questions[step];

 if(q===Q1) data.purpose=t;
 if(q===Q2) data.name=t;
 if(q===Q3){
   data.isSub=t;
   if(isNotSub(t)){
     questions.splice(step+1,0,Q4);
   }
 }
 if(q===Q4) data.contact=t;
 if(q===Q5) data.id=t;

 step++;
 if(step<questions.length){ setTimeout(ask,700); return; }

 /* ===== 最終案内（本人確認書類チェック追加） ===== */
 let msg="ありがとうございます。";
 if(/ない|持ってない|ありません|未所持|いいえ/.test(data.id)){
   msg+="本人確認書類が無い場合、できる手続きが限られることがございます。";
 }
 msg+="スタッフがお手続き可能なお時間をお伝えしに参ります。しばらくお待ちください。";

 addBubble(msg,"ai");
 await speak(msg);

 await send();
 await new Promise(r=>setTimeout(r,3000));
 reset();
}

/* Firestore送信 */
async function send(){
 status.innerText="送信中…";
 status.style.background="orange";

 const memo=`【本人】${data.isSub} 【契約者連絡可否】${data.contact||"本人"} 【本人確認書類】${data.id}`;

 await addDoc(collection(db,"visitors"),{
   name:data.name+" 様",
   table:"AI受付",
   content:data.purpose,
   memo:memo,
   createdAt:serverTimestamp(),
   timeStr:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})
 });

 status.innerText="受付完了";
 status.style.background="#000";
}

/* 初期化 */
function reset(){
 step=0;
 questions=[Q1,Q2,Q3,Q5];
 data={purpose:"",name:"",isSub:"",contact:"",id:""};
 chat.innerHTML="";
 startBtn.style.display="block";
 action.style.display="none";
}

/* チャット */
function addBubble(t,type){
 const d=document.createElement("div");
 d.className="bubble "+type;
 d.innerText=t;
 chat.appendChild(d);
 chat.scrollTop=chat.scrollHeight;
}

/* 強制スクロール */
new MutationObserver(()=>chat.scrollTop=chat.scrollHeight)
.observe(chat,{childList:true});

/* 音声 */
function speak(text,auto=false){
 return new Promise(res=>{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="ja-JP";
  u.rate=1.1;
  u.pitch=1.4;
  u.onend=()=>{ if(auto)setTimeout(toggleMic,300); res(); };
  speechSynthesis.speak(u);
 });
}
</script>

</body>
</html>
