<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>かんたん受付</title>

<style>
/* ===== 全体 ===== */
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
  background: #f7f7f7;
  text-align: center;
}

/* ===== 背景透かし画像（中央固定） ===== */
body::before {
  content: "";
  position: fixed;
  top: 120px;     /* ヘッダー+進捗バー */
  bottom: 160px;  /* 受付開始ボタン領域 */
  left: 0;
  right: 0;
  background: url('reception.png') center center / contain no-repeat;
  opacity: 0.25;
  pointer-events: none;
  z-index: 0;
}

/* ===== ヘッダー ===== */
header {
  background: #2196f3;
  color: white;
  padding: 12px;
  font-size: 20px;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}

/* ===== 進捗バー ===== */
#progress {
  background: #ddd;
  height: 10px;
}

#progress-bar {
  height: 100%;
  width: 0%;
  background: #4caf50;
  transition: width 0.3s;
}

/* ===== メイン ===== */
main {
  padding: 20px;
  position: relative;
  z-index: 1; /* 背景より前に */
}

.question {
  font-size: 20px;
  margin-bottom: 20px;
}

/* ===== ボタン ===== */
button {
  padding: 14px 20px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  margin: 10px;
  cursor: pointer;
}

.btn-yes { background: #4caf50; color: white; }
.btn-no  { background: #f44336; color: white; }

/* ===== フッター受付開始 ===== */
footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  padding: 12px;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.1);
  z-index: 10;
}

#startBtn {
  width: 90%;
  padding: 16px;
  font-size: 20px;
  background: #ff9800;
  color: white;
  border-radius: 12px;
  border: none;
}
</style>
</head>

<body>

<header>
  かんたん受付
</header>

<div id="progress">
  <div id="progress-bar"></div>
</div>

<main id="main">
  <div class="question" id="questionText"></div>
  <div id="buttons"></div>
</main>

<footer>
  <button id="startBtn">受付開始</button>
</footer>

<script>
/* ===== 質問フロー ===== */
const questions = [
  {
    text: "契約者ご本人ですか？",
    options: [
      { label: "はい", next: 1 },
      { label: "いいえ", next: 2 }
    ]
  },
  {
    text: "ご用件を選択してください",
    options: [
      { label: "料金の確認", next: null },
      { label: "契約内容の変更", next: null }
    ]
  },
  {
    text: "手続き時に契約者ご本人へ連絡は可能ですか？",
    options: [
      { label: "はい", next: 1 },
      { label: "いいえ", next: null }
    ]
  }
];

let currentIndex = 0;

/* ===== 表示更新 ===== */
function showQuestion() {
  const q = questions[currentIndex];
  document.getElementById("questionText").innerText = q.text;

  const btnArea = document.getElementById("buttons");
  btnArea.innerHTML = "";

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.innerText = opt.label;
    btn.className = opt.label === "はい" ? "btn-yes" : "btn-no";
    btn.onclick = () => {
      if (opt.next !== null) {
        currentIndex = opt.next;
        updateProgress();
        showQuestion();
      } else {
        alert("受付内容を確定しました");
      }
    };
    btnArea.appendChild(btn);
  });
}

/* ===== 進捗バー ===== */
function updateProgress() {
  const percent = ((currentIndex) / (questions.length - 1)) * 100;
  document.getElementById("progress-bar").style.width = percent + "%";
}

/* ===== 受付開始 ===== */
document.getElementById("startBtn").onclick = () => {
  currentIndex = 0;
  updateProgress();
  showQuestion();
};

/* 初期表示 */
showQuestion();
</script>

</body>
</html>
