<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ドコモショップ AI受付</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #cc0000; }
        body { 
            font-family: "Hiragino Kaku Gothic ProN", sans-serif; 
            margin: 0; background-color: #f7f7f7; display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
            /* 背景画像：画面の高さに合わせる */
            background-image: url('reception.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 24px; font-weight: bold; z-index: 10; }
        #status-bar { background: rgba(0, 0, 0, 0.75); color: #fff; padding: 8px; text-align: center; font-size: 18px; z-index: 10; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: rgba(255, 255, 255, 0.1); }
        .bubble { padding: 18px 25px; border-radius: 20px; max-width: 80%; line-height: 1.4; font-size: 26px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .ai { background: rgba(245, 245, 245, 0.95); align-self: flex-start; border: 1px solid #ccc; color: #000; }
        .user { background: rgba(255, 240, 240, 0.95); border: 3px solid var(--primary); align-self: flex-end; color: #cc0000; }
        
        #controls { 
            background: rgba(255, 255, 255, 0.9); border-top: 1px solid #ccc; 
            padding: 20px 20px calc(50px + env(safe-area-inset-bottom)); /* 下部の余白を確保 */
            text-align: center; z-index: 10; 
        }
        /* 巨大受付ボタンを中央寄りに */
        #start-btn { width: 85%; padding: 35px; font-size: 38px; font-weight: bold; background: var(--primary); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #a00000; }
        #start-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #action-area { display: none; }
        /* スッキリしたマイクアイコン */
        #mic-btn { 
            width: 100px; height: 100px; border-radius: 50%; background: #fff; color: var(--primary); 
            border: 4px solid var(--primary); font-size: 45px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; margin: 0 auto;
        }
        #mic-btn.listening { background: var(--primary); color: #fff; transform: scale(1.1); box-shadow: 0 0 15px rgba(204,0,0,0.3); }
    </style>
</head>
<body>
    <header>ドコモショップ 受付</header>
    <div id="status-bar">ボタンを押してください</div>
    <div id="chat-container"></div>
    <div id="controls">
        <button id="start-btn" onclick="beginReception()">受付をはじめる</button>
        <div id="action-area">
            <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
            <div style="font-size:20px; font-weight:bold; margin-top:10px; color:#333;">お話しください</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const firebaseConfig = {
            apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
            authDomain: "oh-tai.firebaseapp.com",
            projectId: "oh-tai",
            storageBucket: "oh-tai.firebasestorage.app",
            messagingSenderId: "1070284840120",
            appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const genAI = new GoogleGenerativeAI("AIzaSyC2nltuDWJ1wSKFnKF4zXN3Y4dtYlTIyxQ");
        const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-lite-001" });

        // ★AIへの命令：一問一答と順番を徹底。雑談・相談・機種案内は「死罪」レベルで禁止
        const sysPrompt = `あなたはドコモショップの受付ロボットです。
        【絶対ルール】1回につき1つだけ以下の順で質問せよ。
        1.ご用件は？ 2.名字は？ 3.本人か？ 4.書類（免許証かマイナンバー）はあるか？
        
        書類が無い場合のみ「制限の可能性」を伝えて。
        最後は「スタッフが時間を伝えにまいります。お待ちください。」と言って終了せよ。
        機種相談・理由の聞き取りは一切禁止。可愛く、短く。`;

        let chat = model.startChat({ history: [{ role: "user", parts: [{ text: "了解。決められた4ステップ以外の会話はせず、一問一答のみ行う。" }] }] });
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "ja-JP";
        recognition.onresult = (e) => processInput(e.results[0][0].transcript);
        recognition.onstart = () => { document.getElementById("mic-btn").classList.add("listening"); updateStatus("聞いています...", "green"); };
        recognition.onend = () => { document.getElementById("mic-btn").classList.remove("listening"); updateStatus("待機中", "#000"); };

        window.beginReception = () => {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("action-area").style.display = "block";
            const msg = "いらっしゃいませ。本日はどのようなご用件でしょうか？";
            addBubble(msg, "ai"); speak(msg, true);
        };

        window.toggleMic = () => { try { recognition.start(); } catch(e) { recognition.stop(); } };

        async function processInput(text) {
            addBubble(text, "user");
            updateStatus("AI確認中...", "blue");
            try {
                const result = await chat.sendMessage(text);
                const response = result.response.text().replace(/[*_]/g, '');
                addBubble(response, "ai");
                
                // 終了の決め台詞が出たら送信
                if (response.includes("時間を伝えにまいります")) {
                    await sendDataToAdmin();
                    speak(response, false);
                } else {
                    speak(response, true);
                }
            } catch (e) { console.error(e); }
        }

        async function sendDataToAdmin() {
            try {
                const history = await chat.getHistory();
                const userTalk = history.filter(h => h.role === "user").map(h => h.parts[0].text).join(" / ");
                // ★管理ボードへの漏洩を防ぐため、この処理専用の独立したAI呼び出しを行う
                const res = await model.generateContent(`会話から[名字,用件,備考]を抽出せよ。余計な文章は一切書かず、カンマ区切り1行だけで出力。会話：${userTalk}`);
                const raw = res.response.text().split(",");
                
                await addDoc(collection(db, "visitors"), {
                    name: (raw[0] || "お客様").trim().replace(/指示.*/, "") + " 様",
                    table: "AI受付機",
                    content: (raw[1] || "その他").trim(),
                    memo: (raw[2] || userTalk).trim(),
                    createdAt: serverTimestamp(),
                    timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                });
                updateStatus("受付完了しました", "#000");
            } catch(e) { console.error(e); }
        }

        function addBubble(t, type) {
            const d = document.createElement("div"); d.className = "bubble " + type; d.innerText = t;
            const c = document.getElementById("chat-container"); c.appendChild(d); c.scrollTo(0, c.scrollHeight);
        }

        function speak(t, auto) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t); 
            u.lang = "ja-JP"; 
            u.pitch = 1.5; // 声を高くしてかわいらしく
            u.rate = 1.1; 
            u.onend = () => { if(auto) setTimeout(() => toggleMic(), 300); }; 
            window.speechSynthesis.speak(u);
        }

        function updateStatus(t, c) { document.getElementById("status-bar").innerText = t; document.getElementById("status-bar").style.backgroundColor = c; }
    </script>
</body>
</html>
