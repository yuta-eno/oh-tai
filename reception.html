<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root { --primary:#cc0000; }

body {
    font-family: "Hiragino Kaku Gothic ProN", sans-serif;
    margin:0;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
}

/* ===== 背景イラスト 最背面 ===== */
body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:0; right:0;
    background:url('reception1.png') center/contain no-repeat;
    opacity:0.9;
    pointer-events:none;
    z-index:-1;
}

header{
    background:var(--primary);
    color:#fff;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

#status-bar{
    background:#000;
    color:#fff;
    padding:8px;
    text-align:center;
    font-size:18px;
}

/* ===== チャット ===== */
#chat-container{
    flex:1;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:15px;
    scroll-behavior:smooth;
}

.bubble{
    padding:20px 25px;
    border-radius:20px;
    max-width:80%;
    font-size:26px;
    font-weight:bold;
}

.ai{ background:#f5f5f5; border:1px solid #ccc; align-self:flex-start; }
.user{ background:#fff0f0; border:3px solid var(--primary); color:#cc0000; align-self:flex-end; }

/* ===== 下部操作 ===== */
#controls{
    background:#fff;
    border-top:1px solid #ccc;
    padding:20px;
    text-align:center;
}

#start-btn{
    width:90%;
    padding:30px;
    font-size:36px;
    font-weight:bold;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:50px;
}

#action-area{ display:none; }

#mic-btn{
    width:110px;
    height:110px;
    border-radius:50%;
    border:5px solid var(--primary);
    font-size:50px;
    color:var(--primary);
}

/* ===== 発話指示表示 ===== */
#speak-indicator{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
    color:#999;
}
#speak-indicator.active{
    color:#cc0000;
    font-size:42px;
    animation:blink 1s infinite;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}
</style>
</head>

<body>

<header>ドコモショップ 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">受付をはじめる</button>

    <div id="action-area">
        <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <div id="speak-indicator">● お話しください</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
    apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
    authDomain: "oh-tai.firebaseapp.com",
    projectId: "oh-tai",
    storageBucket: "oh-tai.firebasestorage.app",
    messagingSenderId: "1070284840120",
    appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 質問 */
const Q_PURPOSE = "本日はどのようなご用件でしょうか？";
const Q_NAME = "恐れ入りますが、名字のみお名前を教えてください。";
const Q_SUB = "ご契約者ご本人様でしょうか？";
const Q_CONTACT = "契約者ご本人様へお電話でのご連絡は可能でしょうか？";
const Q_ID = "本人確認書類（免許証またはマイナンバーカード）はお持ちでしょうか？";

let questions = [Q_PURPOSE, Q_NAME, Q_SUB, Q_ID];
let currentStep = 0;

let userData = {purpose:"", name:"", isSubscriber:"", canContact:"", hasID:""};

/* 判定 */
function isNotSubscriber(t){
    return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(t);
}

/* 受付開始 */
window.beginReception = () => {
    startBtn.style.display="none";
    actionArea.style.display="block";
    askNext();
};

/* 質問 */
function askNext(){
    const q = questions[currentStep];
    addBubble(q,"ai");
    speak(q,true);
}

/* 音声認識 */
const recognition = new (window.SpeechRecognition||window.webkitSpeechRecognition)();
recognition.lang="ja-JP";

recognition.onstart = ()=>{
    micBtn.classList.add("listening");
    speakIndicator.classList.add("active");
    updateStatus("聞いています…","green");
};

recognition.onend = ()=>{
    micBtn.classList.remove("listening");
    speakIndicator.classList.remove("active");
    updateStatus("待機中","#000");
};

recognition.onresult = e=>handleAnswer(e.results[0][0].transcript);
window.toggleMic=()=>{try{recognition.start();}catch(e){recognition.stop();}};

/* 回答処理 */
async function handleAnswer(text){
    addBubble(text,"user");

    const q = questions[currentStep];

    if(q===Q_PURPOSE) userData.purpose=text;
    if(q===Q_NAME) userData.name=text;
    if(q===Q_SUB){
        userData.isSubscriber=text;
        if(isNotSubscriber(text)){
            questions.splice(currentStep+1,0,Q_CONTACT);
        }
    }
    if(q===Q_CONTACT) userData.canContact=text;
    if(q===Q_ID) userData.hasID=text;

    currentStep++;

    if(currentStep<questions.length){
        setTimeout(askNext,800);
        return;
    }

    let msg="ありがとうございます。スタッフがまいりますのでお待ちください。";
    addBubble(msg,"ai");
    await speak(msg);

    await sendToAdmin();

    await new Promise(r=>setTimeout(r,4000));
    addBubble("次の受付を待機します。","ai");
    await speak("次の受付を待機します。");

    resetReception();
}

/* Firestore送信 */
async function sendToAdmin(){
    updateStatus("送信中…","orange");

    const memo = `【本人】${userData.isSubscriber} 【契約者連絡可否】${userData.canContact||"本人"} 【本人確認書類】${userData.hasID}`;

    await addDoc(collection(db,"visitors"),{
        name:userData.name,
        table:"AI受付",
        content:userData.purpose,
        memo:memo,
        createdAt:serverTimestamp(),
        timeStr:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})
    });

    updateStatus("受付完了","#000");
}

/* 初期化 */
function resetReception(){
    currentStep=0;
    questions=[Q_PURPOSE,Q_NAME,Q_SUB,Q_ID];
    userData={purpose:"",name:"",isSubscriber:"",canContact:"",hasID:""};
    chatContainer.innerHTML="";
    startBtn.style.display="block";
    actionArea.style.display="none";
}

/* UI */
function addBubble(t,type){
    const d=document.createElement("div");
    d.className="bubble "+type;
    d.innerText=t;
    chatContainer.appendChild(d);
    chatContainer.scrollTop=chatContainer.scrollHeight;
}

/* 強制自動スクロール監視 */
const observer=new MutationObserver(()=>chatContainer.scrollTop=chatContainer.scrollHeight);
observer.observe(chatContainer,{childList:true});

/* 音声 */
function speak(text,auto=false){
    return new Promise(res=>{
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text);
        u.lang="ja-JP";
        u.rate=1.1;
        u.pitch=1.4;
        u.onend=()=>{if(auto)setTimeout(toggleMic,300);res();};
        speechSynthesis.speak(u);
    });
}

/* ステータス */
function updateStatus(t,c){
    statusBar.innerText=t;
    statusBar.style.background=c;
}

/* DOM */
const chatContainer=document.getElementById("chat-container");
const startBtn=document.getElementById("start-btn");
const actionArea=document.getElementById("action-area");
const micBtn=document.getElementById("mic-btn");
const statusBar=document.getElementById("status-bar");
const speakIndicator=document.getElementById("speak-indicator");
</script>

</body>
</html>
