<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-firestore.js"></script>

<style>
:root{ --primary:#cc0000; }

body{
    font-family:"Hiragino Kaku Gothic ProN",sans-serif;
    margin:0;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1.0; 
    pointer-events: none;
    z-index: -10;
}

header{
    background:var(--primary);
    color:white;
    padding:12px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    z-index: 10;
    height: 36px; 
    box-sizing: content-box;
}
#status-bar{
    background:#000;
    color:#fff;
    padding:6px;
    text-align:center;
    font-size:18px;
    z-index: 10;
}

#chat-container{
    position: absolute;
    bottom: 210px;
    left: 0;
    right: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    pointer-events: auto; 
    z-index: 15;
}

#user-container {
    position: absolute;
    bottom: 420px; 
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 15;
}

.bubble{
    font-weight:bold;
    line-height: 1.5; 
    text-align: center;
    animation: fadeIn 0.3s ease-out;
}

.ai{ 
    background: rgba(0, 0, 0, 0.75); 
    color: #fff; 
    border-radius: 15px;
    width: 90%; 
    max-width: 800px;
    padding: 15px 30px;
    font-size: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    word-break: keep-all;
    overflow-wrap: break-word;
    max-height: 150px; 
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch; 
    scrollbar-width: none; 
    text-align: left; 
}
.ai::-webkit-scrollbar {
    display: none;
}

.user{ 
    background: rgba(255, 255, 255, 0.95); 
    border: 2px solid #cc0000; 
    color: #333; 
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 22px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: inline-block;
    pointer-events: auto; 
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

#controls{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(5px);
    border-top:1px solid #ccc;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    text-align:center;
    z-index:9999;
}

#start-btn{
    width:90%;
    padding:20px;
    font-size:32px;
    font-weight:bold;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:50px;
}

#action-area{display:none;}

#mic-btn{
    width:80px;
    height:80px;
    border-radius:50%;
    border:4px solid var(--primary);
    font-size:38px;
    color:var(--primary);
    background: #fff;
}

#speak-indicator{
    font-size: 28px;
    font-weight: bold;
    margin-top: 15px;
    color: #cc0000;
    opacity: 0;
    transition: opacity 0.2s;
}
#speak-indicator.active{
    opacity: 1;
    animation: blink 1.2s infinite;
}

#speak-indicator.manual-prompt {
    opacity: 1;
    color: #ff6600; 
    font-size: 24px;
    animation: pulse 2s infinite; 
}

#reset-btn-container {
    position: absolute;
    top: 100px; 
    left: 20px; 
    z-index: 20;
}
#reset-btn-ui {
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 2px solid white;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: none; 
}

#reset-popup {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10000;
    align-items: center;
    justify-content: center;
}
.popup-box {
    background: #fff;
    color: #cc0000;
    padding: 40px;
    border-radius: 20px;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
}

@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
}
    <link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</style>
</head>

<body>

<div id="reset-popup">
    <div class="popup-box">「受付をはじめる」から<br>やり直します。</div>
</div>

<div id="reset-btn-container">
    <button id="reset-btn-ui" onclick="forceReset()"><i class="fas fa-redo"></i> はじめから</button>
</div>

<video id="bg-video" loop muted playsinline src="reception.mp4#t=0.001" preload="metadata"></video>

<header>ドコモショップ川口Ｒ１２２号店 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>
<div id="user-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">受付をはじめる</button>

    <div id="action-area">
        <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <div id="speak-indicator">● お話しください</div>
    </div>
</div>

<script>
var tableNum = '未設定';
var urlMatch = window.location.search.match(/[?&]table=([^&]+)/);
if(urlMatch) {
    tableNum = decodeURIComponent(urlMatch[1]);
}

var firebaseConfig = {
    apiKey:"AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
    authDomain:"oh-tai.firebaseapp.com",
    projectId:"oh-tai",
    // ★修正：ChatGPT指摘の正しいURL
    storageBucket:"oh-tai.appspot.com",
    messagingSenderId:"1070284840120",
    appId:"1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

var Q0 = { text: "本日は、ご来店ありがとうございます。受付ＡＩの、栄々愛子（ええあいこ）と申します。よろしくお願いいたします。さっそくですが、本日はご予約をされてのご来店でしょうか？", file: "q0_reserve.mp3" };
var Q_TIME = { text: "ご予約のお時間は何時でしょうか？", file: "q_time.mp3" };
var Q_WAIT = { text: "かしこまりました。のちほどスタッフより、本日のご案内可能なお時間をお伝えいたします。", file: "q_wait.mp3" };
var Q1 = { text: "本日はどのようなご用件でしょうか？", file: "q1.mp3" };
var Q2 = { text: "恐れ入りますが、名字のみお名前を教えてください。", file: "q2.mp3" };
var Q3 = { text: "ご契約者ご本人様でしょうか？", file: "q3.mp3" };
var Q4 = { text: "契約者ご本人様へお電話でのご連絡は可能でしょうか？", file: "q4.mp3" };
var Q5 = { text: "本人確認書類はお持ちでしょうか？", file: "q5.mp3" };

var questions = [Q0];
var step = 0;
var data = {isReserve:"", reserveTime:"", purpose:"", name:"", isSub:"", contact:"", id:""};

var isProcessing = false; 
var isSending = false; 

function isNotSub(t){
    return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(t);
}

var chat = document.getElementById("chat-container");
var userContainer = document.getElementById("user-container"); 
var startBtn = document.getElementById("start-btn");
var action = document.getElementById("action-area");
var micBtn = document.getElementById("mic-btn");
var status = document.getElementById("status-bar");
var speakIndicator = document.getElementById("speak-indicator");
var resetBtnUi = document.getElementById("reset-btn-ui"); 

function playBeep() {
    // 無音
}

window.beginReception = function() {
    startBtn.style.display="none";
    action.style.display="block";
    resetBtnUi.style.display="block"; 
    ask();
};

window.forceReset = function() {
    var popup = document.getElementById("reset-popup");
    popup.style.display = "flex";
    setTimeout(function() {
        window.location.reload();
    }, 5000);
};

function ask() {
    var q = questions[step];
    addBubble(q.text,"ai");
    speak(q.file, true);
}

var useNativeMic = (typeof AndroidMic !== "undefined");
var rec;

if (!useNativeMic) {
    rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    rec.lang = "ja-JP";
    rec.onstart = function() { window.onNativeVoiceStart(); };
    rec.onend = function() { window.onNativeVoiceEnd(); };
    rec.onresult = function(e) { window.onNativeVoiceResult(e.results[0][0].transcript); };
}

window.onNativeVoiceStart = function() {
    if (isSending) return; 
    isProcessing = false; 
    micBtn.classList.add("listening");
    speakIndicator.innerText = "● お話しください";
    speakIndicator.classList.remove("manual-prompt");
    speakIndicator.classList.add("active"); 
    status.innerText="聞いています…";
    status.style.background="green";
};

window.onNativeVoiceEnd = function() {
    micBtn.classList.remove("listening");
    status.innerText="待機中";
    status.style.background="#000";
    speakIndicator.classList.remove("active");
    if (!isProcessing && !isSending) {
        speakIndicator.innerText = "👆マイクのボタンをタッチしてお話しください";
        speakIndicator.classList.add("manual-prompt");
    }
};

window.onNativeVoiceResult = function(text) {
    if (isSending) return; 
    isProcessing = true; 
    answer(text);
    window.onNativeVoiceEnd();
};

window.toggleMic = function(){ 
    if (isSending) return; 
    if(window.AndroidMic) {
        window.AndroidMic.startListening();
    } else {
        try{rec.start();}catch(e){rec.stop();} 
    }
};

function answer(t) {
    if (isSending) return; 
    
    addBubble(t, "user");
    var q = questions[step];

    if(q === Q0) {
        data.isReserve = t;
        if(/はい|してる|予約/.test(t) && !/してない|いいえ/.test(t)) {
            questions.push(Q_TIME, Q1, Q2, Q3, Q5); 
        } else {
            questions.push(Q1, Q_WAIT, Q2, Q3, Q5); 
        }
    }
    else if(q === Q_TIME) data.reserveTime = t;
    else if(q === Q1) data.purpose = t;
    else if(q === Q2) data.name = t;
    else if(q === Q3) {
        data.isSub = t;
        if(isNotSub(t)){
            questions.splice(step+1,0,Q4);
        }
    }
    else if(q === Q4) data.contact = t;
    else if(q === Q5) data.id = t;

    step++;
    if(step < questions.length) { 
        if(questions[step] === Q_WAIT) {
            addBubble(Q_WAIT.text, "ai");
            speak(Q_WAIT.file, false).then(function() {
                step++;
                setTimeout(ask, 800);
            });
        } else {
            setTimeout(ask, 1000); 
        }
        return; 
    }

    // ★修正：最後の質問が終わったら、送信モードに完全ロックする
    isSending = true;

    var msgText="個人情報保護のため、お手続きする電話番号と、ご契約者様のフルネームをテーブルのボードにご記入ください。あわせて、備え付けの紙のアンケートにもご記入をお願いいたします。まもなくスタッフが参りますので、そのままお待ちくださいませ。";
    addBubble(msgText,"ai");

    // 音声再生を開始。裏側ですぐにデータ送信も開始し、初期画面への帰還を確約する
    speak("finish_new.mp3", false);
    
    // データ送信処理（終わったら強制的に初期画面に戻す）
    send();
}

function send() {
    status.innerText = "送信中…";
    status.style.background = "orange";
    
    var reserveInfo = data.reserveTime ? "【予約】あり（" + data.reserveTime + "）" : "【予約】なし（当日来店）";
    var memo = reserveInfo + " 【本人】" + data.isSub + " 【契約者連絡可否】" + (data.contact || "本人") + " 【本人確認書類】" + data.id;
    
    var d = new Date();
    var h = ("0" + d.getHours()).slice(-2);
    var m = ("0" + d.getMinutes()).slice(-2);
    var timeString = h + ":" + m;
    
    var isDone = false;
    
    // ★絶対タイマー：Firebaseがフリーズしても、8秒後には【問答無用で】初期画面に強制送還する
    var fallbackTimer = setTimeout(function() {
        if(!isDone) {
            isDone = true;
            status.innerText = "完了処理中...";
            status.style.background = "#000";
            setTimeout(reset, 2000); // 2秒後にリセット
        }
    }, 8000);

    db.collection("visitors").add({
        name: data.name,
        table: tableNum + "テーブル",
        content: data.purpose || "来店予約（" + data.reserveTime + "）", 
        memo: memo,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        timeStr: timeString
    }).then(function() {
        if(!isDone) {
            isDone = true;
            clearTimeout(fallbackTimer);
            status.innerText = "受付完了";
            status.style.background = "#000";
            // ★送信成功後、3秒で必ずリセット
            setTimeout(reset, 3000);
        }
    }).catch(function(error) {
        if(!isDone) {
            isDone = true;
            clearTimeout(fallbackTimer);
            console.error("送信エラー:", error);
            status.innerText = "送信失敗";
            status.style.background = "red";
            // ★送信失敗しても、5秒で必ずリセット
            setTimeout(reset, 5000);
        }
    });
}

function reset() {
    step = 0;
    questions = [Q0];
    data = {isReserve:"", reserveTime:"", purpose:"", name:"", isSub:"", contact:"", id:""};
    isProcessing = false; 
    isSending = false; // ★ロック解除
    chat.innerHTML = "";
    userContainer.innerHTML = ""; 
    startBtn.style.display = "block";
    
    // ★マイクボタンややり直しボタンは「受付をはじめる」を押すまで消す（初期状態に戻す）
    action.style.display = "none";
    resetBtnUi.style.display = "none"; 
    
    speakIndicator.classList.remove("active", "manual-prompt"); 
    status.innerText = "準備完了"; 
    status.style.background = "#000";
}

function addBubble(t, type) {
    var d = document.createElement("div");
    d.className = "bubble " + type;
    
    if(type === "ai"){
        chat.innerHTML = ""; 
        d.innerText = t;
        chat.appendChild(d);
        
        d.scrollTop = 0;
        setTimeout(function() {
            var scrollInterval = setInterval(function() {
                if(!d.isConnected || d.scrollTop + d.clientHeight >= d.scrollHeight){
                    clearInterval(scrollInterval);
                } else {
                    d.scrollTop += 1; 
                }
            }, 40); 
        }, 1000);
        
    } else {
        userContainer.innerHTML = ""; 
        d.innerText = "🗣️ あなた：" + t;
        userContainer.appendChild(d);
    }
}

function speak(fileName, auto) {
    return new Promise(function(res) {
        var video = document.getElementById("bg-video");
        var audio = new Audio(fileName);
        var isResolved = false;

        // ★音声再生フリーズ防止機能
        function finish() {
            if (!isResolved) {
                isResolved = true;
                video.pause();
                if(auto) setTimeout(toggleMic, 300);
                res();
            }
        }

        // 10秒経っても音声が終わらなければ強制終了
        setTimeout(finish, 10000);

        audio.onplay = function() {
            var vp = video.play();
            if (vp !== undefined) { vp.catch(function(){}); }
        };
        
        audio.onended = finish;
        audio.onerror = finish;

        var ap = audio.play();
        if (ap !== undefined) {
            ap.catch(function() { finish(); });
        }
    });
}
</script>

</body>
</html>
