<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ドコモショップ AI受付</title>
    <style>
        :root { --primary: #cc0000; }
        body { 
            font-family: "Hiragino Kaku Gothic ProN", sans-serif; 
            margin: 0; 
            background-color: #eee; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            overflow: hidden; 
            /* 背景画像を設定 */
            background-image: url('reception.png'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
        }
        
        header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 28px; font-weight: bold; border-bottom: 5px solid #a00000; z-index: 10; }
        #status-bar { background: rgba(0, 0, 0, 0.7); color: #fff; padding: 10px; text-align: center; font-weight: bold; font-size: 20px; z-index: 10; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; background: rgba(255, 255, 255, 0.1); }
        
        .bubble { padding: 25px; border-radius: 20px; max-width: 70%; line-height: 1.4; font-size: 32px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ai { background: rgba(245, 245, 245, 0.95); align-self: flex-start; border: 2px solid #ccc; color: #000; }
        .user { background: rgba(255, 240, 240, 0.95); border: 4px solid var(--primary); align-self: flex-end; color: #cc0000; }
        
        #controls { background: rgba(238, 238, 238, 0.9); border-top: 3px solid #ccc; padding: 20px; padding-bottom: 50px; text-align: center; z-index: 10; }
        
        #start-btn { width: 80%; padding: 40px; font-size: 40px; font-weight: bold; background: var(--primary); color: white; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 0 #a00000; }
        #start-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #action-area { display: none; }
        #mic-btn { width: 120px; height: 120px; border-radius: 50%; background: var(--primary); color: white; border: 6px solid #fff; font-size: 60px; cursor: pointer; }
        #mic-btn.listening { background: #008000; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <header>ドコモショップ 受付</header>
    <div id="status-bar">ボタンを押してください</div>
    <div id="chat-container"></div>
    <div id="controls">
        <button id="start-btn" onclick="beginReception()">受付をはじめる</button>
        <div id="action-area">
            <button id="mic-btn" onclick="toggleMic()">🎤</button>
            <div style="font-size:20px; font-weight:bold; margin-top:10px;">ここを押して話す</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const firebaseConfig = {
            apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
            authDomain: "oh-tai.firebaseapp.com",
            projectId: "oh-tai",
            storageBucket: "oh-tai.firebasestorage.app",
            messagingSenderId: "1070284840120",
            appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const genAI = new GoogleGenerativeAI("AIzaSyC2nltuDWJ1wSKFnKF4zXN3Y4dtYlTIyxQ");
        const model = genAI.getGenerativeModel({ model: "gemini-2.0-flash-lite-001" });

        const sysPrompt = `あなたはドコモショップの受付スタッフです。以下の手順を1つずつ実行してください。雑談や機種の説明は絶対禁止です。
        1. 挨拶し「ご用件は何でしょうか？」と聞く。
        2. 名字を聞く。
        3. 契約者本人か聞く。
        4. 本人確認書類（原本）の有無を聞く。
        終わったら必ず「スタッフがお伝えしにまいります。このままお待ちください。」と言う。
        ※一度に複数を質問しないでください。`;

        let chat = model.startChat({ history: [{ role: "user", parts: [{ text: "了解しました。一問一答形式で正確に受付を行います。" }] }] });
        
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "ja-JP";
        recognition.onresult = (e) => processInput(e.results[0][0].transcript);
        recognition.onstart = () => { document.getElementById("mic-btn").classList.add("listening"); updateStatus("どうぞお話しください", "green"); };
        recognition.onend = () => { document.getElementById("mic-btn").classList.remove("listening"); updateStatus("待機中", "#000"); };

        window.beginReception = () => {
            document.getElementById("start-btn").style.display = "none";
            document.getElementById("action-area").style.display = "block";
            const msg = "いらっしゃいませ。ドコモショップ受付です。本日はどのようなご用件でしょうか？";
            addBubble(msg, "ai"); speak(msg, true);
        };

        window.toggleMic = () => { try { recognition.start(); } catch(e) { recognition.stop(); } };

        async function processInput(text) {
            addBubble(text, "user");
            updateStatus("AIが考えています...", "blue");
            try {
                const result = await chat.sendMessage(text);
                const response = result.response.text().replace(/[*_]/g, '');
                addBubble(response, "ai");
                
                if (response.includes("スタッフがお伝えしにまいります")) {
                    await sendDataToAdmin();
                    speak(response, false);
                } else {
                    speak(response, true);
                }
            } catch (e) { console.error(e); }
        }

        async function sendDataToAdmin() {
            try {
                const history = await chat.getHistory();
                const userTalk = history.filter(h => h.role === "user").map(h => h.parts[0].text).join(" / ");
                // データを抽出して管理ボード(index.html)の形式に合わせる
                const res = await model.generateContent(`以下の会話から「名字」「用件」「備考」を抽出して、カンマ区切り1行だけで出力して。余計な文章は一切含めないで。
                会話: ${userTalk}`);
                const raw = res.response.text().split(",");
                
                await addDoc(collection(db, "visitors"), {
                    name: (raw[0] || "お客様").trim() + " 様",
                    table: "AI受付機",
                    content: (raw[1] || "その他").trim(),
                    memo: (raw[2] || userTalk).trim(),
                    createdAt: serverTimestamp(),
                    timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
                });
                updateStatus("受付が完了しました", "#000");
            } catch(e) { console.error(e); }
        }

        function addBubble(t, type) {
            const d = document.createElement("div"); d.className = "bubble " + type; d.innerText = t;
            const c = document.getElementById("chat-container"); c.appendChild(d); c.scrollTo(0, c.scrollHeight);
        }

        function speak(t, auto) {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(t); u.lang = "ja-JP"; u.pitch = 1.2;
            u.onend = () => { if(auto) toggleMic(); }; window.speechSynthesis.speak(u);
        }

        function updateStatus(t, c) { document.getElementById("status-bar").innerText = t; document.getElementById("status-bar").style.backgroundColor = c; }
    </script>
</body>
</html>
