<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root { --primary: #cc0000; }

body { 
    font-family: "Hiragino Kaku Gothic ProN", sans-serif; 
    margin: 0; 
    background-color: #f7f7f7; 
    display: flex; 
    flex-direction: column; 
    height: 100vh; 
    overflow: hidden; 
}

body::before {
    content: "";
    position: fixed;
    top: 140px;
    bottom: 220px;
    left: 0;
    right: 0;
    background: url('reception1.png') center center / contain no-repeat;
    opacity: 1.0;
    pointer-events: none;
    z-index: 0;
}

header { 
    background: var(--primary); 
    color: white; 
    padding: 15px; 
    text-align: center; 
    font-size: 24px; 
    font-weight: bold; 
    z-index: 10; 
}

#status-bar { 
    background: rgba(0,0,0,0.75); 
    color: #fff; 
    padding: 8px; 
    text-align: center; 
    font-size: 18px; 
}

#chat-container { 
    flex: 1; 
    overflow-y: auto; 
    padding: 20px; 
    display: flex; 
    flex-direction: column; 
    gap: 15px; 
    background: rgba(255,255,255,0.2); 
}

.bubble { 
    padding: 20px 25px; 
    border-radius: 20px; 
    max-width: 80%; 
    font-size: 26px; 
    font-weight: bold; 
}

.ai { background:#f5f5f5; border:1px solid #ccc; align-self:flex-start; }
.user { background:#fff0f0; border:3px solid var(--primary); color:#cc0000; align-self:flex-end; }

#controls { 
    background: rgba(255,255,255,0.9); 
    border-top: 1px solid #ccc; 
    padding: 20px; 
    text-align: center; 
}

#start-btn { 
    width: 90%; 
    padding: 30px; 
    font-size: 36px; 
    font-weight: bold; 
    background: var(--primary); 
    color: white; 
    border: none; 
    border-radius: 50px; 
}

#action-area { display:none; }

#mic-btn { 
    width: 100px; height:100px; border-radius:50%; 
    border:4px solid var(--primary); 
    font-size:45px; color:var(--primary);
}
#mic-btn.listening { background:var(--primary); color:white; }
</style>
</head>

<body>

<header>ドコモショップ 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">受付をはじめる</button>
    <div id="action-area">
        <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <div style="font-size:20px;margin-top:10px;">お話しください</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
    authDomain: "oh-tai.firebaseapp.com",
    projectId: "oh-tai",
    storageBucket: "oh-tai.firebasestorage.app",
    messagingSenderId: "1070284840120",
    appId: "1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== 質問 ===== */
const Q_PURPOSE = "いらっしゃいませ。本日はどのようなご用件でしょうか？";
const Q_NAME = "恐れ入りますが、名字のみお名前を教えていただけますか？";
const Q_SUBSCRIBER = "ご契約者ご本人様でしょうか？";
const Q_CONTACT = "契約者ご本人様へお電話などでご連絡は可能でしょうか？";
const Q_ID = "本人確認書類（免許証またはマイナンバーカード）はお持ちでしょうか？";

let questions = [Q_PURPOSE, Q_NAME, Q_SUBSCRIBER, Q_ID];
let currentStep = 0;

/* ===== データ ===== */
let userData = {
    purpose: "", name: "", isSubscriber: "", canContact: "", hasID: ""
};

/* ===== 判定 ===== */
function isNotSubscriber(text) {
    return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(text);
}

/* ===== 受付開始 ===== */
window.beginReception = () => {
    document.getElementById("start-btn").style.display = "none";
    document.getElementById("action-area").style.display = "block";
    askNext();
};

/* ===== 質問 ===== */
function askNext() {
    const q = questions[currentStep];
    addBubble(q, "ai");
    speak(q, true);
}

/* ===== 音声認識 ===== */
const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.lang = "ja-JP";
recognition.onresult = e => handleAnswer(e.results[0][0].transcript);
recognition.onstart = () => {
    document.getElementById("mic-btn").classList.add("listening");
    updateStatus("聞いています...", "green");
};
recognition.onend = () => {
    document.getElementById("mic-btn").classList.remove("listening");
    updateStatus("待機中", "#000");
};
window.toggleMic = () => { try { recognition.start(); } catch(e) { recognition.stop(); } };

/* ===== 回答処理 ===== */
async function handleAnswer(text) {
    addBubble(text, "user");

    const q = questions[currentStep];

    if (q === Q_PURPOSE) userData.purpose = text;
    if (q === Q_NAME) userData.name = text;
    if (q === Q_SUBSCRIBER) {
        userData.isSubscriber = text;

        // ★本人じゃないなら連絡質問を次に挿入
        if (isNotSubscriber(text)) {
            questions.splice(currentStep + 1, 0, Q_CONTACT);
        }
    }
    if (q === Q_CONTACT) userData.canContact = text;
    if (q === Q_ID) userData.hasID = text;

    currentStep++;

    if (currentStep < questions.length) {
        setTimeout(askNext, 800);
        return;
    }

    // ===== 最終案内 =====
    let msg = "ありがとうございます。";
    if (/ない|持ってない|いいえ|未所持/.test(userData.hasID)) {
        msg += "本人確認書類が無い場合、できる手続きが限られることがございます。";
    }
    msg += "スタッフがまいりますので、このままお待ちください。";

    addBubble(msg, "ai");
    await speak(msg);

    await sendToAdmin();

    await new Promise(r => setTimeout(r, 5000));
    addBubble("次の受付を待機します。受付開始ボタンを押してください。", "ai");
    await speak("次の受付を待機します。");

    setTimeout(resetReception, 3000);
}

/* ===== Firestore送信 ===== */
async function sendToAdmin() {
    updateStatus("送信中...", "orange");

    const memo = `
本人: ${userData.isSubscriber}
契約者連絡可否: ${userData.canContact || "本人"}
本人確認書類: ${userData.hasID}
`;

    await addDoc(collection(db, "visitors"), {
        name: userData.name,
        table: "AI受付",
        content: userData.purpose,
        memo: memo,
        createdAt: serverTimestamp(),
        timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })
    });

    updateStatus("受付完了", "#000");
}

/* ===== 初期化 ===== */
function resetReception() {
    currentStep = 0;
    questions = [Q_PURPOSE, Q_NAME, Q_SUBSCRIBER, Q_ID];
    userData = { purpose:"", name:"", isSubscriber:"", canContact:"", hasID:"" };

    document.getElementById("chat-container").innerHTML = "";
    document.getElementById("start-btn").style.display = "block";
    document.getElementById("action-area").style.display = "none";
    updateStatus("準備完了", "#000");
}

/* ===== UI ===== */
function addBubble(t, type) {
    const d = document.createElement("div");
    d.className = "bubble " + type;
    d.innerText = t;
    document.getElementById("chat-container").appendChild(d);
}

/* ===== 音声読み上げ ===== */
function speak(text, auto=false) {
    return new Promise(resolve => {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "ja-JP";
        u.rate = 1.1;
        u.pitch = 1.4;
        u.onend = () => { if(auto) setTimeout(toggleMic, 300); resolve(); };
        speechSynthesis.speak(u);
    });
}

/* ===== ステータス ===== */
function updateStatus(t, c) {
    const s = document.getElementById("status-bar");
    s.innerText = t;
    s.style.backgroundColor = c;
}
</script>

</body>
</html>
