<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{ --primary:#cc0000; }
body{font-family:"Hiragino Kaku Gothic ProN",sans-serif;margin:0;background:#f7f7f7;height:100dvh;overflow:hidden;}
header{background:var(--primary);color:white;padding:12px;text-align:center;font-size:22px;font-weight:bold;}
#status-bar{background:#000;color:#fff;padding:6px;text-align:center;}
#chat-container,#user-container{position:absolute;left:0;right:0;display:flex;justify-content:center;}
#chat-container{bottom:210px;}
#user-container{bottom:420px;}
.bubble{font-weight:bold;padding:15px;border-radius:15px;max-width:90%;}
.ai{background:#000;color:#fff;font-size:22px;}
.user{background:#fff;border:2px solid #cc0000;font-size:20px;}
#controls{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px;text-align:center;}
#start-btn{width:90%;padding:20px;font-size:28px;background:#cc0000;color:#fff;border:none;border-radius:40px;}
</style>
</head>

<body>

<header>ドコモショップAI受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>
<div id="user-container"></div>

<div id="controls">
<button id="start-btn" onclick="beginReception()">受付をはじめる</button>
</div>

<script>
var API_KEY="AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak";
var PROJECT="oh-tai";

var tableNum="未設定";
var urlMatch=location.search.match(/[?&]table=([^&]+)/);
if(urlMatch) tableNum=decodeURIComponent(urlMatch[1]);

var Q0="本日はご予約でのご来店でしょうか？";
var Q1="本日はどのようなご用件でしょうか？";
var Q2="お名前（名字）を教えてください。";

var questions=[Q0,Q1,Q2];
var step=0;
var data={reserve:"",purpose:"",name:""};

var chat=document.getElementById("chat-container");
var userC=document.getElementById("user-container");

function addBubble(t,type){
  var d=document.createElement("div");
  d.className="bubble "+type;
  d.innerText=t;
  if(type=="ai"){chat.innerHTML="";chat.appendChild(d);}
  else{userC.innerHTML="";userC.appendChild(d);}
}

function beginReception(){
  document.getElementById("start-btn").style.display="none";
  ask();
}

function ask(){
  addBubble(questions[step],"ai");
}

function answer(t){
  addBubble(t,"user");

  if(step==0) data.reserve=t;
  if(step==1) data.purpose=t;
  if(step==2) data.name=t;

  step++;
  if(step<questions.length){ setTimeout(ask,800); return; }

  addBubble("受付を登録しています…","ai");
  sendFirestore();
}

function sendFirestore(){
  var d=new Date();
  var payload={
    fields:{
      name:{stringValue:data.name},
      table:{stringValue:tableNum+"テーブル"},
      content:{stringValue:data.purpose},
      memo:{stringValue:"予約:"+data.reserve},
      createdAt:{timestampValue:d.toISOString()}
    }
  };

  var url="https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents/visitors?key="+API_KEY;

  var xhr=new XMLHttpRequest();
  xhr.open("POST",url,true);
  xhr.setRequestHeader("Content-Type","application/json");

  xhr.onreadystatechange=function(){
    if(xhr.readyState==4){
      if(xhr.status>=200&&xhr.status<300){
        addBubble("受付完了しました","ai");
      }else{
        addBubble("送信失敗: "+xhr.status,"ai");
      }
    }
  };
  xhr.onerror=function(){
    addBubble("ネットワークエラー","ai");
  };

  xhr.send(JSON.stringify(payload));
}

/* 仮の音声入力用（テスト） */
window.addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    var t=prompt("入力");
    if(t) answer(t);
  }
});
</script>

</body>
</html>
