<script type="module">
...
/* ===== 状態 ===== */
let currentStep = 0;
let skipContactQuestion = true;
let userData = {
    purpose: "",
    name: "",
    isSubscriber: "",
    canContact: "",
    hasID: ""
};

/* ===== 質問定義（固定） ===== */
const questions = [
    "いらっしゃいませ。本日はどのようなご用件でしょうか？",
    "ありがとうございます。恐れ入りますが、名字のみお名前を教えていただけますか？",
    "ありがとうございます。ご契約者ご本人様でしょうか？",
    "手続きの際、ご契約者ご本人様にお電話などでご連絡は可能でしょうか？",
    "本人確認書類（免許証またはマイナンバーカード）はお持ちでしょうか？"
];

/* ===== 本人じゃない判定 ===== */
function isNotSubscriber(text) {
    return /いいえ|違う|違います|ちげー|本人じゃない|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(text);
}

/* ===== 質問表示 ===== */
function askNext() {

    // 本人なら契約者連絡質問をスキップ
    if (currentStep === 3 && skipContactQuestion) {
        currentStep++;
    }

    if (currentStep < questions.length) {
        const q = questions[currentStep];
        addBubble(q, "ai");
        speak(q, true);
    }
}

/* ===== 回答処理 ===== */
async function handleAnswer(text) {
    addBubble(text, "user");

    if (currentStep === 0) userData.purpose = text;
    if (currentStep === 1) userData.name = text;

    if (currentStep === 2) {
        userData.isSubscriber = text;
        skipContactQuestion = !isNotSubscriber(text);
    }

    if (currentStep === 3) userData.canContact = text;
    if (currentStep === 4) userData.hasID = text;

    currentStep++;

    if (currentStep < questions.length) {
        setTimeout(askNext, 800);
        return;
    }

    // 最終案内
    let finalMsg = "ありがとうございます。";
    if (userData.hasID.match(/ない|持ってない|いいえ|未所持/)) {
        finalMsg += "本人確認書類が無い場合、できる手続きが限られることがございます。";
    }
    finalMsg += "現在予約のお客様がいらっしゃるため、スタッフが手続き可能な時間を伝えにまいります。このままお待ちください。";

    addBubble(finalMsg, "ai");
    await speak(finalMsg);

    await sendToAdmin();
    await new Promise(r => setTimeout(r, 5000));

    addBubble("次の受付を待機します。受付開始ボタンを押してください。", "ai");
    await speak("次の受付を待機します。");

    setTimeout(resetReception, 5000);
}

/* ===== 初期化 ===== */
function resetReception() {
    currentStep = 0;
    skipContactQuestion = true;
    userData = { purpose:"", name:"", isSubscriber:"", canContact:"", hasID:"" };

    document.getElementById("chat-container").innerHTML = "";
    document.getElementById("start-btn").style.display = "block";
    document.getElementById("action-area").style.display = "none";

    updateStatus("準備完了", "#000");
}

</script>
