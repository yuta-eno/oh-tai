<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{ --primary:#cc0000; }

body{
    font-family:"Hiragino Kaku Gothic ProN",sans-serif;
    margin:0;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1.0; 
    pointer-events: none;
    z-index: -10;
}

header{
    background:var(--primary);
    color:white;
    padding:12px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    z-index: 10;
}
#status-bar{
    background:#000;
    color:#fff;
    padding:6px;
    text-align:center;
    font-size:18px;
    z-index: 10;
}

#chat-container{
    position: absolute;
    bottom: 140px;
    left: 0;
    right: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    pointer-events: none;
}

.bubble{
    padding:20px 30px;
    border-radius:25px;
    width: 90%; 
    max-width: 800px;
    font-size:32px; 
    font-weight:bold;
    line-height: 1.4;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.ai{ background: rgba(255, 255, 255, 0.9); border: 2px solid #ccc; color: #000; }
.user{ background: rgba(204, 0, 0, 0.9); border: 2px solid #fff; color: #fff; }

#controls{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(5px);
    border-top:1px solid #ccc;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    text-align:center;
    z-index:9999;
}

#start-btn{
    width:90%;
    padding:20px;
    font-size:32px;
    font-weight:bold;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:50px;
}

#action-area{display:none;}

#mic-btn{
    width:80px;
    height:80px;
    border-radius:50%;
    border:4px solid var(--primary);
    font-size:38px;
    color:var(--primary);
    background: #fff;
}

#speak-indicator{
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
    color:#555;
}
#speak-indicator.active{
    font-size:24px;
    color:#cc0000;
    animation:blink 1s infinite;
}
@keyframes blink{
    0%{opacity:1}
    50%{opacity:0.3}
    100%{opacity:1}
}
</style>
</head>

<body>

<video id="bg-video" loop muted playsinline src="reception.mp4"></video>

<header>ドコモショップ川口Ｒ１２２号店 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">受付をはじめる</button>

    <div id="action-area">
        <button id="mic-btn" onclick="toggleMic()"><i class="fas fa-microphone"></i></button>
        <div id="speak-indicator">● お話しください</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
 authDomain:"oh-tai.firebaseapp.com",
 projectId:"oh-tai",
 storageBucket:"oh-tai.firebasestorage.app",
 messagingSenderId:"1070284840120",
 appId:"1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

/* ★質問と音声ファイルの定義 */
const Q1={ text: "本日はどのようなご用件でしょうか？", file: "q1.mp3" }; //
const Q2={ text: "恐れ入りますが、名字のみお名前を教えてください。", file: "q2.mp3" }; //
const Q3={ text: "ご契約者ご本人様でしょうか？", file: "q3.mp3" }; //
const Q4={ text: "契約者ご本人様へお電話でのご連絡は可能でしょうか？", file: "q4.mp3" }; //
const Q5={ text: "本人確認書類はお持ちでしょうか？", file: "q5.mp3" }; //

let questions=[Q1,Q2,Q3,Q5];
let step=0;
let data={purpose:"",name:"",isSub:"",contact:"",id:""};

function isNotSub(t){
 return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(t);
}

const chat=document.getElementById("chat-container");
const startBtn=document.getElementById("start-btn");
const action=document.getElementById("action-area");
const micBtn=document.getElementById("mic-btn");
const status=document.getElementById("status-bar");
const speakIndicator=document.getElementById("speak-indicator");

/* ★受付開始：最初のクリックで音声を「アンロック」する */
window.beginReception=()=>{
 startBtn.style.display="none";
 action.style.display="block";
 
 // ダミー再生でブラウザの制限を解除
 const unlockAudio = new Audio();
 unlockAudio.play().then(() => {
     unlockAudio.pause();
     ask(); 
 }).catch(e => {
     console.log("Audio unlock failed, proceeding anyway", e);
     ask();
 });
};

function ask(){
 const q=questions[step];
 addBubble(q.text,"ai");
 speak(q.file,true);
}

const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang="ja-JP";

rec.onstart=()=>{
 micBtn.classList.add("listening");
 speakIndicator.classList.add("active");
 status.innerText="聞いています…";
 status.style.background="green";
};

rec.onend=()=>{
 micBtn.classList.remove("listening");
 speakIndicator.classList.remove("active");
 status.innerText="待機中";
 status.style.background="#000";
};

rec.onresult=e=>answer(e.results[0][0].transcript);
window.toggleMic=()=>{try{rec.start();}catch(e){rec.stop();}};

async function answer(t){
 addBubble(t,"user");
 const q=questions[step];

 if(q===Q1) data.purpose=t;
 if(q===Q2) data.name=t;
 if(q===Q3){
   data.isSub=t;
   if(isNotSub(t)){
     questions.splice(step+1,0,Q4);
   }
 }
 if(q===Q4) data.contact=t;
 if(q===Q5) data.id=t;

 step++;
 if(step<questions.length){ setTimeout(ask,1000); return; }

 /* ===== ★最終案内：分割された3ファイルを順に再生 ===== */
 let msgText="ありがとうございます。";
 const hasNoId = /ない|持ってない|ありません|未所持|いいえ/.test(data.id);
 if(hasNoId) msgText += "本人確認書類が無い場合、できる手続きが限られることがございます。";
 msgText += "スタッフがお手続き可能なお時間をお伝えしに参ります。しばらくお待ちください。";

 addBubble(msgText,"ai");

 await speak("finish_start.mp3"); //
 if(hasNoId) await speak("warning_id.mp3"); //
 await speak("finish_end.mp3"); //

 await send();
 await new Promise(r=>setTimeout(r,3000));
 reset();
}

async function send(){
 status.innerText="送信中…";
 status.style.background="orange";
 const memo=`【本人】${data.isSub} 【契約者連絡可否】${data.contact||"本人"} 【本人確認書類】${data.id}`;
 await addDoc(collection(db,"visitors"),{
   name:data.name,
   table:"AI受付",
   content:data.purpose,
   memo:memo,
   createdAt:serverTimestamp(),
   timeStr:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})
 });
 status.innerText="受付完了";
 status.style.background="#000";
}

function reset(){
 step=0;
 questions=[Q1,Q2,Q3,Q5];
 data={purpose:"",name:"",isSub:"",contact:"",id:""};
 chat.innerHTML="";
 startBtn.style.display="block";
 action.style.display="none";
}

function addBubble(t,type){
 chat.innerHTML = ""; 
 const d=document.createElement("div");
 d.className="bubble "+type;
 d.innerText=t;
 chat.appendChild(d);
}

/* ★音声再生と動画連動のコアロジック */
function speak(fileName,auto=false){
 return new Promise(res=>{
  const video = document.getElementById("bg-video");
  const audio = new Audio(fileName);

  audio.onplay = () => { video.play().catch(e => console.log("Video play failed:", e)); };
  audio.onended = () => { 
    video.pause();
    if(auto)setTimeout(toggleMic,300); 
    res(); 
  };
  
  audio.play().catch(e => { 
      console.error("Audio play error:", fileName, e); 
      res(); 
  });
 });
}
</script>

</body>
</html>
