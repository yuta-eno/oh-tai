<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>ドコモショップ AI受付（タッチパネル版）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
:root{ --primary:#cc0000; }

body{
    font-family:"Hiragino Kaku Gothic ProN",sans-serif;
    margin:0;
    background:#f7f7f7;
    display:flex;
    flex-direction:column;
    height:100dvh;
    overflow:hidden;
}

/* 背景動画 */
#bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1.0; 
    pointer-events: none;
    z-index: -10;
}

header{
    background:var(--primary);
    color:white;
    padding:12px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    z-index: 10;
    height: 36px; 
    box-sizing: content-box;
}
#status-bar{
    background:#000;
    color:#fff;
    padding:6px;
    text-align:center;
    font-size:18px;
    z-index: 10;
}

#chat-container{
    position: absolute;
    bottom: 210px;
    left: 0;
    right: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    pointer-events: auto; 
    z-index: 15;
}

#user-container {
    position: absolute;
    bottom: 420px; 
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 15;
}

.bubble{
    font-weight:bold;
    line-height: 1.5; 
    text-align: center;
    animation: fadeIn 0.3s ease-out;
}

.ai{ 
    background: rgba(0, 0, 0, 0.75); 
    color: #fff; 
    border-radius: 15px;
    width: 90%; 
    max-width: 800px;
    padding: 15px 30px;
    font-size: clamp(20px, 5vw, 28px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    word-break: keep-all;
    overflow-wrap: break-word;
    max-height: 150px; 
    overflow-y: auto; 
    -webkit-overflow-scrolling: touch; 
    scrollbar-width: none; 
    text-align: left; 
}
.ai::-webkit-scrollbar {
    display: none;
}

.user{ 
    background: rgba(255, 255, 255, 0.95); 
    border: 2px solid #cc0000; 
    color: #333; 
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 22px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    display: inline-block;
    pointer-events: auto; 
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

#controls{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(5px);
    border-top:1px solid #ccc;
    padding:10px 10px calc(10px + env(safe-area-inset-bottom));
    text-align:center;
    z-index:9999;
}

#start-btn{
    width:90%;
    padding:20px;
    font-size:32px;
    font-weight:bold;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:50px;
}

/* ★追加：ボタンや入力欄を表示するエリアのデザイン */
#options-container {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding-top: 5px;
}
.option-btn {
    background: #fff;
    color: var(--primary);
    border: 2px solid var(--primary);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    transition: 0.2s;
    min-width: 120px;
}
.option-btn:active {
    background: #f0f0f0;
    transform: translateY(2px);
    box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}
.input-box {
    font-size: 22px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    text-align: center;
    width: 60%;
    max-width: 300px;
}
.submit-btn {
    background: var(--primary);
    color: #fff;
}

#reset-btn-container {
    position: absolute;
    top: 100px; 
    left: 20px; 
    z-index: 20;
}
#reset-btn-ui {
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 2px solid white;
    padding: 8px 16px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: none; 
}

#reset-popup {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 10000;
    align-items: center;
    justify-content: center;
}
.popup-box {
    background: #fff;
    color: #cc0000;
    padding: 40px;
    border-radius: 20px;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    text-align: center;
}
</style>

<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>

<body>

<div id="reset-popup">
    <div class="popup-box">「受付をはじめる」からやり直します。</div>
</div>

<div id="reset-btn-container">
    <button id="reset-btn-ui" onclick="forceReset()"><i class="fas fa-redo"></i> はじめから</button>
</div>

<video id="bg-video" loop muted playsinline src="reception.mp4#t=0.001" preload="metadata"></video>

<header>ドコモショップ川口Ｒ１２２号店 受付</header>
<div id="status-bar">準備完了</div>
<div id="chat-container"></div>
<div id="user-container"></div>

<div id="controls">
    <button id="start-btn" onclick="beginReception()">画面をタッチして受付をはじめる</button>
    
    <div id="options-container"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

const urlParams = new URLSearchParams(window.location.search);
const tableNum = urlParams.get('table') || '未設定';

const firebaseConfig={
 apiKey:"AIzaSyBjVdE9X17QxIMj449VXLiqYwBu79SHDak",
 authDomain:"oh-tai.firebaseapp.com",
 projectId:"oh-tai",
 storageBucket:"oh-tai.firebasestorage.app",
 messagingSenderId:"1070284840120",
 appId:"1:1070284840120:web:7f9735a1f1d2a5d815e84d"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const Q0 = { text: "本日は、ご来店ありがとうございます。受付ＡＩの、栄々愛子（ええあいこ）と申します。よろしくお願いいたします。さっそくですが、本日はご予約をされてのご来店でしょうか？", file: "q0_reserve.mp3" };
const Q_TIME = { text: "ご予約のお時間は何時でしょうか？", file: "q_time.mp3" };
const Q_WAIT = { text: "かしこまりました。のちほどスタッフより、本日のご案内可能なお時間をお伝えいたします。", file: "q_wait.mp3" };
const Q1={ text: "本日はどのようなご用件でしょうか？", file: "q1.mp3" };
const Q2={ text: "恐れ入りますが、名字のみお名前をご入力ください。", file: "q2.mp3" };
const Q3={ text: "ご契約者ご本人様でしょうか？", file: "q3.mp3" };
const Q4={ text: "契約者ご本人様へお電話でのご連絡は可能でしょうか？", file: "q4.mp3" };
const Q5={ text: "本人確認書類はお持ちでしょうか？", file: "q5.mp3" };

let questions=[Q0];
let step=0;
let data={isReserve:"", reserveTime:"", purpose:"", name:"", isSub:"", contact:"", id:""};

function isNotSub(t){
 return /本人じゃない|いいえ|違う|ちげー|本人ではない|契約者ではない|契約者じゃない|家族|代理|妻|夫|子供|子ども|親|父|母|兄|姉|弟|妹/.test(t);
}

const chat=document.getElementById("chat-container");
const userContainer=document.getElementById("user-container"); 
const startBtn=document.getElementById("start-btn");
const optionsContainer=document.getElementById("options-container");
const status=document.getElementById("status-bar");
const resetBtnUi=document.getElementById("reset-btn-ui"); 

window.beginReception=()=>{
    startBtn.style.display="none";
    resetBtnUi.style.display="block"; 
    ask();
};

window.forceReset=()=>{
    const popup = document.getElementById("reset-popup");
    popup.style.display = "flex";
    setTimeout(() => {
        window.location.reload();
    }, 5000);
};

function ask(){
    const q=questions[step];
    addBubble(q.text,"ai");
    speak(q.file);
    renderOptions(q); // ★追加：質問に合わせてボタンを表示
}

// ★新規追加：各質問に応じた「ボタン」や「入力欄」を生成する関数
function renderOptions(q) {
    optionsContainer.innerHTML = "";
    optionsContainer.style.display = "flex";
    status.innerText = "ボタンを選んでください";
    status.style.background = "green";

    if (q === Q0) {
        optionsContainer.innerHTML = `
            <button class="option-btn" onclick="answer('はい')">はい（予約あり）</button>
            <button class="option-btn" onclick="answer('いいえ')">いいえ（予約なし）</button>
        `;
    } else if (q === Q_TIME) {
        optionsContainer.innerHTML = `
            <input type="time" id="time-input" class="input-box" value="10:00">
            <button class="option-btn submit-btn" onclick="answer(document.getElementById('time-input').value)">決定</button>
        `;
    } else if (q === Q1) {
        const purposes = ["新規契約", "機種変更", "故障・修理", "料金相談", "プラン変更", "操作説明", "解約", "その他"];
        let html = "";
        purposes.forEach(p => {
            html += `<button class="option-btn" onclick="answer('${p}')">${p}</button>`;
        });
        optionsContainer.innerHTML = html;
    } else if (q === Q2) {
        optionsContainer.innerHTML = `
            <input type="text" id="name-input" class="input-box" placeholder="例：ドコモ" autocomplete="off">
            <button class="option-btn submit-btn" onclick="let v=document.getElementById('name-input').value; if(v) answer(v);">次へ</button>
        `;
    } else if (q === Q3 || q === Q4 || q === Q5) {
        optionsContainer.innerHTML = `
            <button class="option-btn" onclick="answer('はい')">はい</button>
            <button class="option-btn" onclick="answer('いいえ')">いいえ</button>
        `;
    } else {
        optionsContainer.style.display = "none";
        status.innerText = "待機中";
        status.style.background = "#000";
    }
}

// ★修正：マイクからではなく、ボタンクリックから呼び出されるように変更
window.answer = async function(t){
    optionsContainer.style.display = "none"; // 選択したらボタンを隠す
    status.innerText = "処理中…";
    status.style.background = "#000";

    addBubble(t,"user");
    const q=questions[step];

    if(q===Q0) {
        data.isReserve = t;
        if(/はい|してる|予約/.test(t) && !/してない|いいえ/.test(t)) {
            questions.push(Q_TIME, Q1, Q2, Q3, Q5); 
        } else {
            questions.push(Q1, Q_WAIT, Q2, Q3, Q5); 
        }
    }
    else if(q===Q_TIME) data.reserveTime = t;
    else if(q===Q1) data.purpose = t;
    else if(q===Q2) data.name = t;
    else if(q===Q3){
        data.isSub=t;
        if(isNotSub(t)){
            questions.splice(step+1,0,Q4);
        }
    }
    else if(q===Q4) data.contact=t;
    else if(q===Q5) data.id=t;

    step++;
    if(step<questions.length){ 
        if(questions[step] === Q_WAIT) {
            addBubble(Q_WAIT.text, "ai");
            await speak(Q_WAIT.file);
            step++;
            setTimeout(ask, 800);
        } else {
            setTimeout(ask, 1000); 
        }
        return; 
    }

    let msgText="個人情報保護のため、お手続きする電話番号と、ご契約者様のフルネームをテーブルのボードにご記入ください。あわせて、備え付けの紙のアンケートにもご記入をお願いいたします。まもなくスタッフが参りますので、そのままお待ちくださいませ。";
    addBubble(msgText,"ai");

    await speak("finish_new.mp3");

    await send();
    await new Promise(r=>setTimeout(r,3000));
    reset();
};

async function send(){
    status.innerText="送信中…";
    status.style.background="orange";
    
    let reserveInfo = data.reserveTime ? `【予約】あり（${data.reserveTime}）` : `【予約】なし（当日来店）`;
    const memo = `${reserveInfo} 【本人】${data.isSub} 【契約者連絡可否】${data.contact||"本人"} 【本人確認書類】${data.id}`;
    
    await addDoc(collection(db,"visitors"),{
        name:data.name,
        table: tableNum + "テーブル",
        content:data.purpose || "来店予約（" + data.reserveTime + "）", 
        memo:memo,
        createdAt:serverTimestamp(),
        timeStr:new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})
    });
    status.innerText="受付完了";
    status.style.background="#000";
}

function reset(){
    step=0;
    questions=[Q0];
    data={isReserve:"", reserveTime:"", purpose:"", name:"", isSub:"", contact:"", id:""};
    chat.innerHTML="";
    userContainer.innerHTML=""; 
    startBtn.style.display="block";
    optionsContainer.style.display="none";
    resetBtnUi.style.display="none"; 
    status.innerText="準備完了";
    status.style.background="#000";
}

function addBubble(t,type){
    const d=document.createElement("div");
    d.className="bubble "+type;
    
    if(type === "ai"){
        chat.innerHTML = ""; 
        d.innerText=t;
        chat.appendChild(d);
        
        d.scrollTop = 0;
        setTimeout(() => {
            let scrollInterval = setInterval(() => {
                if(!d.isConnected || d.scrollTop + d.clientHeight >= d.scrollHeight){
                    clearInterval(scrollInterval);
                } else {
                    d.scrollTop += 1; 
                }
            }, 40); 
        }, 1000);
        
    } else {
        userContainer.innerHTML = ""; 
        d.innerText = "🗣️ あなた：" + t;
        userContainer.appendChild(d);
    }
}

function speak(fileName){
    return new Promise(res=>{
        const video = document.getElementById("bg-video");
        const audio = new Audio(fileName);

        audio.onplay = () => video.play().catch(e => console.log("Video error:", e));
        
        audio.onended = () => {
            video.pause();
            res();
        };

        audio.onerror = (e) => {
            console.error("Audio Load Error:", e);
            res(); 
        };

        audio.play().catch(e => {
            console.error(e);
            res();
        });
    });
}
</script>

</body>
</html>
